<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vinyl · 真实唱片机</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>
<div class="app">

  <header class="bar">
    <div class="brand"><span class="dot"></span>VINYL<span class="sub">STUDIO</span></div>
    <div class="bar-right">
      <button class="ghost" id="importBtn">＋ 导入音乐</button>
    </div>
  </header>

  <main>
    <section class="deck">
      <div class="machine">
        <div class="deck-top">
          <svg class="surface" viewBox="0 0 750 660" id="surface">
            <defs>
              <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#e8b830"/><stop offset=".5" stop-color="#d4a017"/>
                <stop offset="1" stop-color="#b8860b"/>
              </linearGradient>
              <radialGradient id="platterG" cx="42%" cy="38%">
                <stop offset="0" stop-color="#2a2a2a"/><stop offset=".5" stop-color="#111"/>
                <stop offset="1" stop-color="#050505"/>
              </radialGradient>
              <radialGradient id="vinylG" cx="40%" cy="35%">
                <stop offset="0" stop-color="#1a1a1a"/><stop offset=".5" stop-color="#0a0a0a"/>
                <stop offset="1" stop-color="#000"/>
              </radialGradient>
              <linearGradient id="armG" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#f0d060"/><stop offset=".5" stop-color="#c8a030"/>
                <stop offset="1" stop-color="#8a6a15"/>
              </linearGradient>
              <linearGradient id="metalG" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#e0e0e0"/><stop offset="1" stop-color="#888"/>
              </linearGradient>
            </defs>

            <rect x="10" y="10" width="730" height="640" rx="8" fill="url(#bodyG)"/>
            <rect x="10" y="10" width="730" height="640" rx="8" fill="none" stroke="#8a6a15" stroke-width="2"/>

            <circle cx="330" cy="320" r="252" fill="none" stroke="#1a1a1a" stroke-width="14" stroke-dasharray="2,3"/>
            <circle cx="330" cy="320" r="244" fill="url(#platterG)"/>

            <g transform="translate(330,320)">
              <g id="disc">
                <circle r="230" fill="url(#vinylG)"/>
                <g id="grooves"></g>
                <circle r="230" fill="none" stroke="#222" stroke-width="1"/>
                <circle r="65" class="label"/>
                <text id="labelTitle" class="label-text" x="0" y="-10">—</text>
                <text id="labelSide" class="label-side" x="0" y="18">33⅓</text>
              </g>
            </g>

            <circle cx="330" cy="320" r="6" fill="url(#metalG)"/>
            <circle cx="330" cy="320" r="12" fill="#111" stroke="#555" stroke-width="1"/>

            <g id="arm">
              <circle cx="660" cy="180" r="28" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
              <circle cx="660" cy="180" r="18" fill="#2a2a2a"/>
              <circle class="pivot" cx="660" cy="180" r="10" fill="url(#metalG)"/>
              <line id="armLine" x1="660" y1="180" x2="500" y2="480" stroke="url(#armG)" stroke-width="6" stroke-linecap="round"/>
              <g id="armHead"></g>
              <line id="armWeight" x1="660" y1="180" x2="700" y2="130" stroke="#2a2a2a" stroke-width="10" stroke-linecap="round"/>
              <circle cx="700" cy="130" r="12" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
            </g>
            <rect x="640" y="400" width="30" height="6" rx="2" fill="#333"/>

            <rect x="30" y="560" width="80" height="40" rx="4" fill="#111" stroke="#333" stroke-width="1"/>
            <text x="70" y="585" text-anchor="middle" fill="#ccc" font-size="11" font-family="monospace">START/STOP</text>

            <rect x="130" y="565" width="40" height="28" rx="3" fill="#111" stroke="#333"/>
            <text x="150" y="583" text-anchor="middle" fill="#ccc" font-size="10">33</text>
            <rect x="180" y="565" width="40" height="28" rx="3" fill="#111" stroke="#333"/>
            <text x="200" y="583" text-anchor="middle" fill="#ccc" font-size="10">45</text>

            <rect x="680" y="300" width="20" height="200" rx="3" fill="#111" stroke="#333"/>
            <rect id="fader" x="678" y="390" width="24" height="16" rx="2" fill="#c8c8c8" stroke="#666"/>
            <text x="690" y="290" text-anchor="middle" fill="#333" font-size="9">PITCH</text>

            <text x="650" y="620" fill="#5a4510" font-size="11" font-weight="bold">VINYL-1200</text>
          </svg>
          <div class="led" id="led"><i></i></div>
        </div>

        <div class="deck-front">
          <div class="plate">
            <div class="controls">
              <button id="playBtn" class="play">▶ 落针播放</button>
              <div class="rpm">
                <span class="rpm-l">转速</span>
                <button data-rpm="16">16</button>
                <button data-rpm="33" class="on">33⅓</button>
                <button data-rpm="45">45</button>
                <button data-rpm="78">78</button>
              </div>
            </div>
            <div class="knobs">
              <label class="knob"><span>音量</span><input type="range" id="vol" min="0" max="100" value="80"><i></i></label>
              <label class="knob"><span>杂音</span><input type="range" id="crackle" min="0" max="100" value="35"><i></i></label>
              <label class="knob"><span>抖颤</span><input type="range" id="wow" min="0" max="100" value="20"><i></i></label>
              <label class="knob"><span>warmth</span><input type="range" id="warm" min="2000" max="9000" value="6000"><i></i></label>
            </div>
            <div class="meter"><canvas id="scope" width="260" height="46"></canvas></div>
          </div>
        </div>
      </div>
    </section>

    <aside class="library">
      <div class="drop" id="drop">
        <b>拖拽音乐文件到这里</b>
        <small>MP3 / WAV / OGG / FLAC · 本地导入，不上传服务器</small>
      </div>
      <div class="rack" id="rack"></div>
    </aside>
  </main>
</div>

<input type="file" id="fileInput" accept="audio/*,.mp3,.wav,.ogg,.flac,.m4a" multiple hidden>
<audio id="player" preload="auto"></audio>

<script src="js/records.js?v=7"></script>
<script src="js/vinyl.js?v=7"></script>
<script src="js/ui.js?v=7"></script>
</body>
</html>
